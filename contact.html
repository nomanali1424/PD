<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact — Noman Ali</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>

*{box-sizing:border-box;margin:0;padding:0;}

:root{
--bg:#f9fafb;
--white:#ffffff;
--ink:#111827;
--ink2:#374151;
--muted:#9ca3af;
--border:#e5e7eb;
--blue:#2563eb;
--blue-soft:#eff6ff;
}

body{
font-family:'Manrope',sans-serif;
background:var(--bg);
color:var(--ink);
}

/* NAV */

nav{
background:var(--white);
border-bottom:1px solid var(--border);
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
}

.nav-brand{
display:flex;
align-items:center;
gap:10px;
font-weight:700;
font-size:15px;
}

.avatar{
width:30px;
height:30px;
border-radius:8px;
background:var(--blue);
color:#fff;
font-size:12px;
font-weight:800;
display:flex;
align-items:center;
justify-content:center;
}

/* PAGE */

.page{
max-width:900px;
margin:auto;
padding:70px 40px 100px;
}

/* PROFILE */

.profile{
display:flex;
align-items:center;
gap:30px;
margin-bottom:40px;
}

.profile img{
width:120px;
height:120px;
border-radius:16px;
object-fit:cover;
border:1px solid var(--border);
}

.profile-info h1{
font-size:32px;
font-weight:800;
margin-bottom:8px;
}

.profile-info p{
font-size:16px;
color:var(--ink2);
}

/* CONTACT CARD */

.contact-card{
background:var(--white);
border:1px solid var(--border);
border-radius:16px;
padding:36px;
}

.section-title{
font-size:18px;
font-weight:700;
margin-bottom:20px;
}

/* CONTACT ROWS */

.contact-list{
display:flex;
flex-direction:column;
gap:18px;
}

.contact-item{
display:flex;
align-items:center;
gap:14px;
font-size:15px;
font-weight:500;
}

.contact-item img{
width:22px;
height:22px;
}

.contact-item a{
color:var(--blue);
text-decoration:none;
}

.contact-item a:hover{
text-decoration:underline;
}

/* BADGES */

.badges{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:25px;
}

.badge{
display:flex;
align-items:center;
gap:8px;
padding:8px 14px;
border-radius:8px;
border:1px solid var(--border);
background:var(--white);
font-size:13px;
font-weight:600;
transition:0.15s;
}

.badge img{
width:18px;
height:18px;
}

.badge:hover{
background:var(--blue-soft);
border-color:#c7d2fe;
}

/* FOOTER */

footer{
border-top:1px solid var(--border);
background:var(--white);
padding:24px;
text-align:center;
font-size:13px;
color:var(--muted);
margin-top:60px;
}

@media(max-width:680px){

.profile{
flex-direction:column;
text-align:center;
}

}

</style>
</head>

<body>

<nav>
<div class="nav-brand">

<a href="index.html" style="text-decoration:none;">
<div class="avatar">NA</div>
</a>

Noman Ali

</div>
</nav>
